# Create the app at https://api.slack.com/apps -> "Create New App" -> "From a manifest".
# Then: install to workspace (gives SLACK_BOT_TOKEN), and under Basic Information
# create an App-Level Token with connections:write (gives SLACK_APP_TOKEN).
display_information:
  name: Data Assistant
  description: Ask questions about your data in plain English.
features:
  bot_user:
    display_name: data
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - im:read
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
